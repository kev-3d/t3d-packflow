# A single free service serves both the React app and the FastAPI endpoints.
# Set DATABASE_URL (PostgreSQL, e.g. Neon pooled URL with ?sslmode=require) in the
# dashboard to persist data. Without it the app falls back to SQLite on the
# instance's ephemeral disk, so demo data resets after restart/spin-down.
services:
  - type: web
    name: packflow-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PACKFLOW_SEED_REFERENCE_CATALOG
        value: "true"
      - key: PACKFLOW_DB_PATH
        value: /app/data/packflow.db
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: AUTH_ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: AUTH_BOOTSTRAP_ADMINS
        sync: false
      - key: AUTH_APP_URL
        sync: false
