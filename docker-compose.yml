# Production-like stack: a single container serves the React app and the API.
#   docker compose up -d --build
#   http://localhost:10000
# Data (SQLite) persists in the "packflow-data" volume across restarts/rebuilds.
name: packflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: packflow:latest
    container_name: packflow-app
    restart: unless-stopped
    ports:
      - "${PACKFLOW_PORT:-10000}:10000"
    environment:
      PORT: "10000"
      PACKFLOW_DB_PATH: /app/data/packflow.db
      PACKFLOW_SEED_REFERENCE_CATALOG: "${PACKFLOW_SEED_REFERENCE_CATALOG:-true}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      SLACK_CHANNEL_ID: "${SLACK_CHANNEL_ID:-}"
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:-}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:-}"
      AUTH_ALLOWED_EMAIL_DOMAINS: "${AUTH_ALLOWED_EMAIL_DOMAINS:-}"
      AUTH_BOOTSTRAP_ADMINS: "${AUTH_BOOTSTRAP_ADMINS:-}"
      AUTH_APP_URL: "${AUTH_APP_URL:-}"
    volumes:
      - packflow-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  packflow-data:
