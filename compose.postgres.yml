# PostgreSQL override for the production-like stack.
#   docker compose -f docker-compose.yml -f compose.postgres.yml up -d --build
# The app then uses PostgreSQL instead of the SQLite file in the packflow-data volume.
# To bring existing SQLite data across, see docs/POSTGRES-MIGRATION.md.
services:
  db:
    image: postgres:16-alpine
    container_name: packflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-packflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-packflow}"
      POSTGRES_DB: "${POSTGRES_DB:-packflow}"
    volumes:
      - packflow-pg:/var/lib/postgresql/data
    ports:
      # Bound to localhost only, for the migration script and psql.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-packflow}:${POSTGRES_PASSWORD:-packflow}@db:5432/${POSTGRES_DB:-packflow}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  packflow-pg:
