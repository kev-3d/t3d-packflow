<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Palette: Thought3D brand blue #32C4F3, its tints/shades, and white -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CD3F7"/>
      <stop offset=".55" stop-color="#1FA9DD"/>
      <stop offset="1" stop-color="#0A72A6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#BDEEFC" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F8FE"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD0F7"/>
      <stop offset="1" stop-color="#22B4E8"/>
    </linearGradient>
    <clipPath id="bodyClip"><rect x="252" y="400" width="520" height="420" rx="76"/></clipPath>
  </defs>

  <!-- Background + glow -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="430" fill="url(#glow)"/>

  <!-- Ground shadow -->
  <ellipse cx="530" cy="900" rx="300" ry="30" fill="#075A85" opacity=".45"/>

  <!-- Handle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 404 V336 Q430 300 466 300 H558 Q594 300 594 336 V404" stroke="#074B6E" stroke-width="72"/>
    <path d="M430 404 V336 Q430 300 466 300 H558 Q594 300 594 336 V404" stroke="#32C4F3" stroke-width="40"/>
    <path d="M440 336 Q442 316 466 314" stroke="#FFFFFF" stroke-width="10" opacity=".85"/>
  </g>

  <!-- Suitcase depth (side/back slab) -->
  <rect x="276" y="424" width="520" height="420" rx="76" fill="#0A72A6" stroke="#074B6E" stroke-width="18"/>

  <!-- Wheels: the bulb's half-round base -->
  <g stroke="#074B6E" stroke-width="16" stroke-linejoin="round">
    <path d="M318 848 H422 A52 46 0 0 1 318 848 Z" fill="#32C4F3"/>
    <path d="M630 848 H734 A52 46 0 0 1 630 848 Z" fill="#32C4F3"/>
  </g>

  <!-- Suitcase body -->
  <g clip-path="url(#bodyClip)">
    <rect x="252" y="400" width="520" height="420" fill="url(#body)"/>
    <path d="M700 400 H772 V820 H652 Q722 640 700 400 Z" fill="#C9EEFB"/>
    <!-- Straps -->
    <rect x="300" y="400" width="44" height="420" fill="url(#stripe)"/>
    <rect x="680" y="400" width="44" height="420" fill="url(#stripe)"/>
    <rect x="334" y="400" width="10" height="420" fill="#0E8CC2" opacity=".5"/>
    <rect x="714" y="400" width="10" height="420" fill="#0E8CC2" opacity=".5"/>
  </g>
  <rect x="252" y="400" width="520" height="420" rx="76" fill="none" stroke="#074B6E" stroke-width="20"/>

  <!-- Emblem: Thought3D bulb silhouette (no letters) -->
  <circle cx="512" cy="548" r="80" fill="#D4F2FD"/>
  <path d="M470 504 A50 50 0 0 1 512 488" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <g fill="none" stroke="#32C4F3" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M454 616 A92 92 0 1 1 570 616"/>
    <path d="M470 664 H554"/>
    <path d="M470 704 H554"/>
  </g>
  <path d="M470 740 H554 A42 30 0 0 1 470 740 Z" fill="#32C4F3" stroke="#32C4F3" stroke-width="20" stroke-linejoin="round"/>

  <!-- Gloss highlight -->
  <path d="M276 540 V476 Q276 430 318 426" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".9"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M190 260 l13 34 34 13 -34 13 -13 34 -13 -34 -34 -13 34 -13z"/>
    <path d="M836 300 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9z" opacity=".9"/>
    <circle cx="860" cy="760" r="9" opacity=".7"/>
    <circle cx="160" cy="720" r="7" opacity=".6"/>
  </g>
</svg>
